        <script> "use strict"

            // this is a lot of code, get ready

            function getRandomHexColor() {
                    return '#' + Math.floor(Math.random() * 16777215).toString(16);              
            }

            function Leg(context, x, y, width, height, rotation, rotation_speed, color) {
                this.context = context;
                this.x = x;
                this.y = y; 
                this.width = width;
                this.height = height;
                this.rotation = rotation;
                this.rotation_speed = rotation_speed;
                this.color = color;
            }

            Leg.prototype.update = function () {
                this.rotation += this.rotation_speed;
            }

            Leg.prototype.draw = function () {
                this.context.save();
                this.context.translate(this.x, this.y);
                this.context.rotate(this.rotation);
                this.context.fillStyle = this.color;
                this.context.fillRect(0, 0, this.width, this.height);
                this.context.restore();
            }

            function Ear(context, x, y, width, height, color) {
                this.context = context;
                this.x = x;
                this.y = y; 
                this.width = width;
                this.height = height;
                this.color = color;
            }

            Ear.prototype.draw = function () {
                this.context.save();
                this.context.translate(this.x, this.y);
                this.context.fillStyle = this.color;
                this.context.fillRect(0, 0, this.width, this.height);
                this.context.restore();
            }

            function Eye(context, x, y, width, height, color) {
                this.context = context;
                this.x = x;
                this.y = y; 
                this.width = width;
                this.height = height;
                this.color = color;
            }

            Eye.prototype.draw = function () {
                this.context.save();
                this.context.translate(this.x, this.y);
                this.context.fillStyle = "white";
                this.context.fillRect(0, 0, this.width + 2, this.height + 2);
                this.context.fillStyle = this.color;
                this.context.fillRect(3, 1, this.width, this.height);
                this.context.restore();
            }

            function Head(context, x, y, width, height, rotation, rotation_speed, eye_color, ear_color) {
                this.context = context;
                this.x = x;
                this.y = y; 
                this.width = width;
                this.height = height;
                this.rotation = rotation;
                this.rotation_speed = rotation_speed;
                this.eye_color = eye_color;
                this.ear_color = ear_color;

                this.ear = [
                    new Ear(context, 5, -10, 5, 10, this.ear_color),
                ];

                this.eye = [
                    new Eye(context, 15, 5, 5, 5, this.eye_color),
                ]
            }

            Head.prototype.update = function () {
                this.rotation += this.rotation_speed;

                    var maxAngle = 30 * Math.PI / 180; 

                    if (this.rotation > maxAngle || this.rotation < -maxAngle) {
                        this.rotation_speed *= -1;
                    }

            }

            Head.prototype.draw = function () {
                this.context.save();
                this.context.translate(this.x, this.y);
                this.context.rotate(this.rotation);
                this.context.fillStyle = this.color;
                this.context.fillRect(0, 0, this.width, this.height);

                this.ear.forEach(function (ear) {
                    ear.draw();
                });

                this.eye.forEach(function (eye) {
                    eye.draw();
                });

                this.context.restore();
            }

            function Horse(context, x, y, speed, width, height, color) {
                this.context = context;
                this.x = x;
                this.y = y; 
                this.speed = speed;
                this.color = color;

                var legColor = getRandomHexColor(); 
                var eyeColor = getRandomHexColor(); 
                var earColor = getRandomHexColor(); 

                var legRotationSpeed = Math.random() * 0.1 + 0.05;

                this.legs = [
                
                    new Leg(context, 5, 25, 5, 15, 0,  legRotationSpeed, legColor),
                    new Leg(context, 40, 25, 5, 15, 0,  legRotationSpeed, legColor)
                ]
        

                this.head = [
                    new Head(context, 50, 5, 25, 15, 0, Math.random()/100, eyeColor, earColor)
                ]
            }

            Horse.prototype.update = function () {
                this.x += this.speed;
                this.head[0].update();
                this.legs.forEach(function (leg) {
                    leg.update();
                });
            }

            Horse.prototype.draw = function () {
                this.context.save();
                this.context.translate(this.x, this.y);
                this.context.fillStyle = this.color;
                this.context.fillRect(0, 0, 50, 25);

                this.head.forEach(function (head) {
                    head.draw();
                });

                this.legs.forEach(function (leg) {
                    leg.draw();
                });

                this.context.restore();
            }


            window.onload = function() {
                var canvas = document.getElementById('myCanvas');
                var context = canvas.getContext('2d');

                //store the horses
                var horses = [
                    new Horse(context, 15, 70, Math.random() + 0.1, 50, 25, getRandomHexColor()),
                    new Horse(context, 15, 120, Math.random() + 0.1, 50, 25, getRandomHexColor()),
                    new Horse(context, 15, 170, Math.random() + 0.1, 50, 25, getRandomHexColor())
                ];  

                requestAnimationFrame(mainLoop)

                function mainLoop() {
                    update();
                    draw();
                    requestAnimationFrame(mainLoop);
                }

                function update() {
                    horses.forEach(function (horse) {
                        horse.update();
                    });
                }

                function draw() {
                    context.clearRect(0,0, canvas.width, canvas.height);

                    horses.forEach(function (horse) {

                    });

                    context.restore();

                    for (let i = 0; i < 6; i++) {

                    for (let i = 0; i < 11; i++) {

                    }
                    context.beginPath();
                    context.rect(340,25, 150, 25);
                    context.fillStyle = 'grey';

                    for (let i = 0; i < 5; i++) {
                        context.beginPath();

                    context.beginPath();
                    context.rect(500,35, 140, 15);

                    for (let i = 0; i < 10; i++) {
                        context.beginPath();

                    //backpicket horizontal
                    context.beginPath();
                    context.rect(0,40, canvas.width, 2);
                    context.fillStyle = 'white';

                    //backpicket vertical
                    for(let i = 1; i <= 30; i++) {
                        context.beginPath();
                        context.rect(0 + canvas.width/30 * i, 40, 2, 10)
                        context.fillStyle = 'white';
                        context.fill();
                    }
                }
